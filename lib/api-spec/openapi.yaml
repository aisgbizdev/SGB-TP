openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Trading Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trading-rules
    description: TP Standard Trading Rules disclosure
  - name: auth
    description: Authentication operations
  - name: analyses
    description: Analysis operations
  - name: notifications
    description: Notification operations
  - name: native-push
    description: Native (FCM) mobile push device registration
  - name: admin
    description: Admin operations
  - name: superadmin
    description: Super admin operations
  - name: events
    description: Lightweight client telemetry events
  - name: filter-presets
    description: Saved history-page filter combinations
  - name: watchlist
    description: Per-user instrument watchlist
  - name: user-price-alerts
    description: User-defined standalone price alerts (task #148)
  - name: trade-journal
    description: Manual post-trade journal entries (task #161)
  - name: trader-mirror
    description: Personal trader mirror — behavioural insights (task #162)
  - name: performance
    description: Public AI transparency dashboard — aggregated outcome ledger (task #164)
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: topups
    description: Manual GoPay QRIS credit top-up requests and balance
paths:

  /progression/summary:
    get:
      operationId: getProgressionSummary
      tags: [progression]
      summary: Get the authenticated user's private progression summary
      responses:
        "200":
          description: Private progression summary
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionSummary" } } }
        "401": { description: Not authenticated }
  /progression/catalog:
    get:
      operationId: getProgressionCatalog
      tags: [progression]
      summary: Get private achievement catalog and unlock state
      responses:
        "200":
          description: Achievement catalog
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionCatalog" } } }
  /progression/history:
    get:
      operationId: getProgressionHistory
      tags: [progression]
      summary: Get private append-only XP history
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: XP ledger entries
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionHistory" } } }
  /progression/activity:
    post:
      operationId: recordProgressionActivity
      tags: [progression]
      summary: Record a server-verifiable checklist or guide completion
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionActivityInput" } } }
      responses:
        "201":
          description: Activity awarded XP
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionAward" } } }
        "200":
          description: Duplicate, cap, or insufficient-quality activity
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionAward" } } }
        "400": { description: Invalid activity }
  /progression/evidence:
    post:
      operationId: startProgressionEvidence
      tags: [progression]
      summary: Issue a one-time server evidence token for a known guide or checklist
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionEvidenceStartInput" } } }
      responses:
        "201":
          description: One-time completion evidence
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionEvidenceSession" } } }
        "409":
          description: Preparation cycle already started
  /admin/progression/audit:
    get:
      operationId: getProgressionAudit
      tags: [admin]
      summary: Read-only progression ledger audit; never a leaderboard
      parameters:
        - { name: userId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Auditable ledger rows
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionAudit" } } }
        "401": { description: Not authenticated }
        "403": { description: Admin access required }
  /admin/progression/backfill:
    post:
      operationId: backfillProgression
      tags: [admin]
      summary: Safely backfill only unequivocal historical progression evidence
      responses:
        "200":
          description: Idempotent backfill result
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionBackfillResult" } } }
        "403": { description: Admin access required }
  /topups/config:
    get:
      operationId: getTopupConfig
      tags: [topups]
      summary: Get the fixed top-up packages and QRIS image URL
      responses:
        "200":
          description: Top-up configuration
          content: { application/json: { schema: { $ref: "#/components/schemas/TopupConfig" } } }
  /topups/balance:
    get:
      operationId: getCreditBalance
      tags: [topups]
      summary: Get the authenticated user's analysis credit balance
      responses:
        "200":
          description: Credit balance
          content: { application/json: { schema: { $ref: "#/components/schemas/CreditBalance" } } }
        "401": { description: Not authenticated }
  /topups/doku/checkout:
    post:
      operationId: createDokuCheckout
      tags: [topups]
      summary: Create a DOKU Checkout session for a fixed top-up package
      description: >-
        Every fixed package (see TopupPackageOption.dokuMethods) goes
        through DOKU Checkout — there is no manual/proof-upload path.
        `method` must be one of the package's own dokuMethods and restricts
        the hosted checkout page to either DOKU's Virtual Account channel
        (carries the flat admin fee) or DOKU's own QRIS channel (no fee).
        Returns a hosted DOKU payment page URL to redirect the browser to;
        credits are granted only once POST /topups/doku/notify confirms
        the payment.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateDokuCheckoutBody" } } }
      responses:
        "201":
          description: Checkout session created
          content: { application/json: { schema: { $ref: "#/components/schemas/DokuCheckoutSession" } } }
        "400":
          description: Invalid amount
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { description: Not authenticated }
        "502":
          description: DOKU checkout creation failed
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: DOKU not configured
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /topups/doku/{id}/status:
    get:
      operationId: getDokuTopupStatus
      tags: [topups]
      summary: Poll a DOKU checkout request's status (owner-only)
      description: >-
        For the frontend to poll right after the browser returns from
        DOKU's checkout page, in case the payment notification webhook
        hasn't landed yet.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Current status
          content: { application/json: { schema: { $ref: "#/components/schemas/DokuTopupStatus" } } }
        "400":
          description: Invalid id
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { description: Not authenticated }
        "404":
          description: Not found, or not owned by the caller
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /topups/mine:
    get:
      operationId: getMyTopupRequests
      tags: [topups]
      summary: List the authenticated user's own top-up request history
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Own top-up request history
          content: { application/json: { schema: { $ref: "#/components/schemas/TopupRequestList" } } }
        "401": { description: Not authenticated }
  /admin/topups:
    get:
      operationId: getPendingTopupRequests
      tags: [admin]
      summary: List top-up requests for admin review
      parameters:
        - name: status
          in: query
          description: Filter by review status; defaults to pending
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Top-up requests
          content: { application/json: { schema: { $ref: "#/components/schemas/TopupRequestWithUserList" } } }
        "403":
          description: Forbidden
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /admin/topups/{id}/status:
    patch:
      operationId: reviewCreditTopupRequest
      tags: [admin]
      summary: Approve or reject a top-up request, crediting the user's balance on approval
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewTopupRequestBody" } } }
      responses:
        "200":
          description: Updated top-up request
          content: { application/json: { schema: { $ref: "#/components/schemas/TopupRequest" } } }
        "400":
          description: Invalid status
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Forbidden
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Request not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: Request already reviewed
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /admin/topups/{id}:
    delete:
      operationId: deleteTopupRequest
      tags: [admin]
      summary: Soft-delete a top-up request, reversing its credit grant if it was approved
      description: >-
        Never a physical row delete (credit_ledger.topupRequestId references
        this row once approved). If the request was approved, the credits
        it granted are clawed back first via a negative credit_ledger
        entry, then the row is marked deleted and excluded from every list
        endpoint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Request deleted, with any reversed credits and the user's resulting balance
          content: { application/json: { schema: { $ref: "#/components/schemas/DeleteTopupResponse" } } }
        "400":
          description: Invalid id
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Forbidden
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: Request not found (or already deleted)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /admin/topups/manual:
    post:
      operationId: createManualTopup
      tags: [admin]
      summary: Directly grant credits to a user, bypassing the normal request/proof-upload flow
      description: >-
        For support cases where a user paid but couldn't complete the
        normal top-up flow (e.g. proof upload failed, or the transfer was
        confirmed outside the app). Creates an already-approved top-up
        request row (no proof) and credits the user's balance
        immediately. The `note` is required and stored as the request's
        review note for the audit trail.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManualTopupBody" } } }
      responses:
        "201":
          description: Credits granted
          content: { application/json: { schema: { $ref: "#/components/schemas/TopupRequest" } } }
        "400":
          description: Invalid body or unknown user
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "403":
          description: Forbidden
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /admin/topups/summary:
    get:
      operationId: getTopupSummary
      tags: [admin]
      summary: Aggregate revenue/credits summary across all approved top-up requests, grouped by user and by calendar month
      responses:
        "200":
          description: Top-up revenue summary
          content: { application/json: { schema: { $ref: "#/components/schemas/TopupSummary" } } }
        "403":
          description: Forbidden
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /analyses/guardrails:
    get:
      operationId: getGuardrails
      tags: [analyses]
      summary: Detect active soft warnings for the requested instrument
      parameters:
        - name: instrument
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  prefs:
                    type: object
                    additionalProperties: true
  /analyses/guardrails/telemetry:
    post:
      operationId: recordGuardrailTelemetry
      tags: [analyses]
      summary: Record impression or override of a guardrail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string }
                instrument: { type: string }
                proceeded: { type: boolean }
                metadata: { type: object, additionalProperties: true }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
  /analyses/guardrails/{id}/wait:
    post:
      operationId: waitGuardrail
      tags: [analyses]
      summary: Record an explicit decision to wait
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionAward" } } }
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ProgressionAward" } } }

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trading-rules/standard:
    get:
      operationId: getStandardTradingRules
      tags: [trading-rules]
      summary: Get the fixed TP Standard Trading Rules
      description: "Broker-neutral disclosure for the single TP Standard Trading Rules definition. This endpoint intentionally has no broker selector."
      responses:
        "200":
          description: Current standard rules and effective date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardTradingRules"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google/native:
    post:
      operationId: loginWithGoogleNative
      tags: [auth]
      summary: Exchange a native-app Google ID token for a TradePilot session
      description: |
        For mobile apps that obtain a Google **ID token** with the native
        Google SDK. The server verifies the token (signature, issuer,
        audience against the configured allowlist, expiry, verified email),
        upserts the account (match google_id → link by verified email →
        create), and returns a normal TradePilot Bearer session. No cookie
        is set or required. The response never contains the Google token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleNativeLoginBody"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing/invalid body or unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token signature/issuer/audience invalid, expired, or email not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already linked to a different Google account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Native Google Sign-In not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reauth/google:
    post:
      operationId: reauthenticateWithGoogle
      tags: [auth]
      summary: Prove identity with a fresh Google ID token for a sensitive operation
      description: |
        A live session alone is not sufficient for sensitive operations on
        a Google-only account. The client obtains a **fresh** Google ID
        token and posts it here; on success the server returns a short-lived
        (≤5 min), single-use `reauthToken` bound to the user and to the
        `delete_account` purpose. Currently consumed by DELETE /auth/account.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleReauthBody"
      responses:
        "200":
          description: Re-authentication token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleReauthResponse"
        "400":
          description: Missing/invalid body or unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated, token invalid, or the Google identity does not match the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Native Google Sign-In not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/apple/native:
    post:
      operationId: loginWithAppleNative
      tags: [auth]
      summary: Exchange a native Sign in with Apple identity token for a TradePilot session
      description: |
        For mobile apps that obtain an **identity token** + **authorization
        code** with Apple's native Sign in with Apple SDK. The client
        generates a random raw nonce, sends its SHA-256 hash to Apple, and
        posts the raw nonce here alongside the identity token.

        The server verifies the identity token's signature against Apple's
        published JWKS (never a bare decode), its issuer, audience (against
        `APPLE_ALLOWED_CLIENT_IDS`), expiry, and that the token's `nonce`
        claim equals SHA-256(raw nonce) — then independently exchanges the
        authorization code with Apple's own token endpoint as a second,
        server-to-server proof that it is genuine, unexpired, and unused.
        It then upserts the account (match apple_id → link by verified
        email → create) and returns a normal TradePilot Bearer session. No
        cookie is set or required. The response never contains the Apple
        identity token, authorization code, or any Apple token-endpoint
        credential.

        `givenName`/`familyName` are only ever used as a display-name
        candidate when creating a brand-new account — Apple only sends them
        on the very first authorization for this app, and a later login
        succeeds on `sub` alone even with no name or email in the token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleNativeLoginBody"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing/invalid body or unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            Identity token signature/issuer/audience/nonce invalid or
            expired, email present but not verified, or the authorization
            code could not be exchanged (invalid, expired, or already used)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already linked to a different Apple account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Native Sign in with Apple not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reauth/apple:
    post:
      operationId: reauthenticateWithApple
      tags: [auth]
      summary: Prove identity with a fresh Apple identity token for a sensitive operation
      description: |
        A live session alone is not sufficient for sensitive operations on
        an Apple-only account. The client repeats the native Sign in with
        Apple flow to obtain a **fresh** identity token + authorization
        code + raw nonce and posts them here; on success the server returns
        a short-lived (≤5 min), single-use `reauthToken` bound to the user
        and to the `delete_account` purpose — the same token shape and the
        same consumer (DELETE /auth/account) as POST /auth/reauth/google.
        The Apple `sub` in the fresh token must match the signed-in
        account's stored `apple_id`.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleReauthBody"
      responses:
        "200":
          description: Re-authentication token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppleReauthResponse"
        "400":
          description: Missing/invalid body or unknown fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >-
            Not authenticated, token/code invalid, or the Apple identity
            does not match the signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Native Sign in with Apple not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/tiktok/pending-signup:
    get:
      operationId: getTiktokPendingSignup
      tags: [auth]
      summary: Look up the TikTok profile pending a complete-signup email
      description: |
        After GET /auth/tiktok/callback finds a brand-new TikTok sign-in
        (no existing `tiktok_id` match), it stashes the verified profile
        server-side and redirects the browser to the "finish signup" page
        with a short-lived httpOnly cookie. That page calls this endpoint
        (cookie sent automatically) to show a friendly "Hi, {name}" before
        asking for an email — the `tiktok_id` itself is never returned to
        the client.
      responses:
        "200":
          description: Pending TikTok profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TiktokPendingSignupResponse"
        "404":
          description: No pending TikTok signup cookie, or it expired/was already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/tiktok/complete-signup:
    post:
      operationId: completeTiktokSignup
      tags: [auth]
      summary: Finish a brand-new TikTok sign-in by supplying an email
      description: |
        TikTok's Login Kit never returns an email, so a brand-new sign-in
        (see GET /auth/tiktok/callback) can't create the account directly.
        This endpoint reads the pending TikTok profile from its httpOnly
        cookie (never a request field a client could forge), creates the
        account with the supplied email plus the captured TikTok
        `display_name`/`avatar_url`, and returns a normal TradePilot
        Bearer session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TiktokCompleteSignupBody"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: >-
            Missing/invalid email, or no pending TikTok signup cookie
            (expired or already used)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/facebook/mobile/start:
    get:
      operationId: startFacebookMobileOauth
      tags: [auth]
      summary: Begin the mobile OAuth browser flow for Facebook login/registration
      description: |
        For the Flutter app: open this URL in a system browser (Custom
        Tabs / ASWebAuthenticationSession). It validates `redirect_uri`
        against an exact allowlist (`MOBILE_OAUTH_REDIRECT_URIS`), creates
        a persistent (multi-instance-safe) transaction row, and 302s to
        Facebook's own consent screen — the provider-facing
        `redirect_uri` is still this backend's existing HTTPS
        `/auth/facebook/callback`, registered in the Meta app exactly as
        for the website flow. That callback tells this mobile transaction
        apart from an ordinary web login purely by the `state` value, so
        the website flow's behavior is completely unchanged.
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
          description: Must exactly match one entry in MOBILE_OAUTH_REDIRECT_URIS. No prefix/substring matching.
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
          description: Base64url(SHA-256(code_verifier)) — the mobile app's own PKCE challenge for the eventual /auth/mobile/exchange call.
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
      responses:
        "302":
          description: Redirect to Facebook's consent screen
        "400":
          description: Unknown redirect_uri, or invalid code_challenge/code_challenge_method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Facebook Login not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/tiktok/mobile/start:
    get:
      operationId: startTiktokMobileOauth
      tags: [auth]
      summary: Begin the mobile OAuth browser flow for TikTok login/registration
      description: |
        Same shape as GET /auth/facebook/mobile/start, for TikTok. A
        brand-new TikTok sign-in (no existing tiktok_id) still can't
        create the account directly — TikTok never returns an email — so
        the provider callback redirects the system browser to the
        existing web page `/auth/tiktok/complete-signup?mobile=1` to
        collect one first; only after that page succeeds does the browser
        get handed back to the app via the deep link with a one-time code.
      parameters:
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string }
          description: Must exactly match one entry in MOBILE_OAUTH_REDIRECT_URIS. No prefix/substring matching.
        - name: code_challenge
          in: query
          required: true
          schema: { type: string }
          description: Base64url(SHA-256(code_verifier)) — the mobile app's own PKCE challenge for the eventual /auth/mobile/exchange call.
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, enum: [S256] }
      responses:
        "302":
          description: Redirect to TikTok's consent screen
        "400":
          description: Unknown redirect_uri, or invalid code_challenge/code_challenge_method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: TikTok Login Kit not configured on this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/mobile/exchange:
    post:
      operationId: exchangeMobileAuthCode
      tags: [auth]
      summary: Exchange a one-time mobile OAuth code (+ PKCE verifier) for a TradePilot session
      description: |
        The last leg of the mobile OAuth browser flow: after the app is
        foregrounded via the `id.tradepilot.app://auth/callback?code=...`
        deep link, call this with that code and the PKCE `code_verifier`
        that produced the `code_challenge` originally sent to
        `/mobile/start`. On success this is the only point in the whole
        mobile flow where a TradePilot session is actually created
        (`createSingleSession` — signing in on the phone signs every other
        device out, same policy as every other login method) and the only
        response that ever contains a Bearer token; the deep-link URL
        itself never carries one. The code is single-use, expires 60-120
        seconds after being issued, and is consumed atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileAuthExchangeBody"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing/invalid code or codeVerifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unknown code, or the codeVerifier doesn't match the original code_challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Code already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Code expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/web-handoff:
    post:
      operationId: createWebHandoff
      tags: [auth]
      summary: Mint a one-time URL that signs the browser in as the current (Bearer-authenticated) user
      description: |
        For a mobile app menu item that opens a browser to an authenticated
        page (e.g. Profil -> Kredit Analisis -> tradepilot.id/topup) without
        asking the user to log in again. Call this with the Bearer token
        from the active app session, then open the returned `url` in the
        system browser. The code is single-use and expires in `expiresIn`
        seconds (60s) — open the URL immediately. This does NOT end or
        otherwise affect the native app session that called it.
      security:
        - bearerAuth: []
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebHandoffBody"
      responses:
        "201":
          description: Handoff URL minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebHandoffResponse"
        "400":
          description: next is missing or not on the allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

