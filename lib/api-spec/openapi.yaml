          type: integer
          description: >-
            User-segmentation for cost/revenue accounting (mutually
            exclusive with totalPaidUsers/totalDevUsers): never topped up
            and no admin quota override.
        totalPaidUsers:
          type: integer
          description: >-
            Has at least one lifetime "topup_approval" credit_ledger entry,
            and no admin quota override (Development takes priority — see
            totalDevUsers).
        totalDevUsers:
          type: integer
          description: >-
            Has an admin-set per-user quota override (customQuotaPerDay),
            treated as an internal/testing account even if it also has a
            real top-up on record.
