        have:
          type: integer
          nullable: true
        data:
          type: object
          nullable: true
          additionalProperties: true
      required: [gated]

    TraderMirrorInsights:
      type: object
      description: "Personal trader-mirror insights bundle (task #162). Every category respects a minimum-sample guardrail."
      properties:
        windowDays:
          type: integer
          nullable: true
        totalResolved:
          type: integer
        overallGated:
          type: boolean
        sessions:
          $ref: "#/components/schemas/MirrorGatedInsight"
        instruments:
          $ref: "#/components/schemas/MirrorGatedInsight"
        timing:
          $ref: "#/components/schemas/MirrorGatedInsight"
        postLoss:
          $ref: "#/components/schemas/MirrorGatedInsight"
        exitDiscipline:
          $ref: "#/components/schemas/MirrorGatedInsight"
      required:
        - windowDays
        - totalResolved
        - overallGated
        - sessions
        - instruments
        - timing
        - postLoss
        - exitDiscipline

    TraderMirrorHighlight:
      type: object
      description: "Short bilingual one-liner pulled from the insights bundle. Used for both the dashboard hero strip and the weekly trader-report push. `id` is the stable highlight key; `en` and `idText` are the English and Indonesian copy."
      properties:
        id:
          type: string
        en:
          type: string
        idText:
          type: string
      required: [id, en, idText]

    TraderMirrorResponse:
      type: object
      properties:
        insights:
          $ref: "#/components/schemas/TraderMirrorInsights"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/TraderMirrorHighlight"
        timezone:
          type: string
      required: [insights, highlights, timezone]

    PerformanceBucket:
      type: object
      description: "Single bucket inside a performance segment (per instrument, FX session, or market-condition). `winRate` is wins / (wins + losses) — only trades that actually triggered. `hitRate` is wins / total resolved (expired included)."
      properties:
        key:
          type: string
        triggered:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        expired:
          type: integer
        total:
          type: integer
        winRate:
          type: number
          nullable: true
        hitRate:
          type: number
          nullable: true
      required: [key, triggered, wins, losses, expired, total, winRate, hitRate]

    PerformanceSegment:
      type: object
      description: "A segmentation of the outcome ledger. `gated` is true when no bucket inside the segment crossed the minimum-sample threshold; the UI then renders a 'need more data' placeholder instead of cherry-picking the largest bucket."
      properties:
        gated:
          type: boolean
        need:
          type: integer
        have:
          type: integer
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceBucket"
      required: [gated, need, have, buckets]

    PerformanceOverall:
      type: object
      properties:
        triggered:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        expired:
          type: integer
        total:
          type: integer
        winRate:
          type: number
          nullable: true
        hitRate:
          type: number
          nullable: true
      required: [triggered, wins, losses, expired, total, winRate, hitRate]

    PerformanceBanner:
      type: object
      description: "Honesty banner comparing the last `recentDays` hit-rate against the 30-day baseline. `severity: warn` fires only when recent is >=15pp below baseline AND both windows cleared the minimum-sample guardrail."
      properties:
        severity:
          type: string
          enum: [ok, watch, warn]
        recentDays:
          type: integer
        recentSample:
          type: integer
        baselineSample:
          type: integer
        recentHitRate:
          type: number
          nullable: true
        baselineHitRate:
          type: number
          nullable: true
        delta:
          type: number
          nullable: true
      required:
        - severity
        - recentDays
        - recentSample
        - baselineSample
        - recentHitRate
        - baselineHitRate
        - delta

    PerformanceSummary:
      type: object
      description: "Public AI transparency snapshot for the rolling `windowDays` window (task #164)."
      properties:
        windowDays:
          type: integer
          enum: [30, 90]
        generatedAt:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
          nullable: true
        minSamples:
          $ref: "#/components/schemas/PerformanceMinSamples"
        overall:
          $ref: "#/components/schemas/PerformanceOverall"
        banner:
          $ref: "#/components/schemas/PerformanceBanner"
        byInstrument:
          $ref: "#/components/schemas/PerformanceSegment"
        bySession:
          $ref: "#/components/schemas/PerformanceSegment"
        byCondition:
          $ref: "#/components/schemas/PerformanceSegment"
        byVolatility:
          $ref: "#/components/schemas/PerformanceSegment"
          description: "Deterministic regime classification derived from the stored indicator tally (trending / ranging / choppy). Replaces ADX where raw OHLC isn't kept per analysis."
        byNewsActivity:
          $ref: "#/components/schemas/PerformanceSegment"
          description: "news_week vs quiet_week, derived from whether the AI's fundamental snapshot included any high-impact calendar event at analysis time."
      required:
        - windowDays
        - generatedAt
        - windowStart
        - minSamples
        - overall
        - banner
        - byInstrument
        - bySession
        - byCondition
        - byVolatility
        - byNewsActivity

    PerformanceMinSamples:
      type: object
      description: "Sample-size guardrails the server enforces — published so the UI's honesty copy can quote them directly instead of hardcoding."
      properties:
        bucket:
          type: integer
          description: "Minimum resolved analyses per bucket before that bucket renders."
        overall:
          type: integer
          description: "Minimum resolved analyses overall before any segment renders."
        banner:
          type: integer
          description: "Minimum resolved analyses in the recent window before the current-state banner makes a claim."
      required:
        - bucket
        - overall
        - banner

    JournalSentiment:
      type: object
      description: "Anonymised long-vs-short aggregate for an instrument over the last `windowDays`, gated when sample is too small to safely de-identify."
      properties:
        instrument:
          type: string
        windowDays:
          type: integer
        minSampleSize:
          type: integer
        minDistinctTraders:
          type: integer
        sampleSize:
          type: integer
          nullable: true
          description: "Number of directional (buy/sell) entries in the window. Null when `gated` is true (suppressed to prevent membership inference on thin instruments)."
        distinctTraders:
          type: integer
          nullable: true
          description: "Number of distinct user IDs contributing entries. Null when `gated` is true."
        gated:
          type: boolean
          description: "True when sample is below thresholds; percentages, sampleSize, and distinctTraders are all null."
        buyPct:
          type: integer
          nullable: true
        sellPct:
          type: integer
          nullable: true
      required:
        - instrument
        - windowDays
        - minSampleSize
        - minDistinctTraders
        - sampleSize
        - distinctTraders
        - gated
        - buyPct
        - sellPct
