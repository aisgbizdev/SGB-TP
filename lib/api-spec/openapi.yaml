        quietHoursEnd:
          type: string
          description: HH:MM 24h local time quiet hours end.
          example: "07:00"
        notificationTimezone:
          type: string
          description: IANA timezone quietHoursStart/quietHoursEnd are interpreted in.
          example: Asia/Jakarta
        progressionNotificationsEnabled:
          type: boolean
          description: Enable personal progression notifications.
