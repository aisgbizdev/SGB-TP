        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /native-push/register:
    post:
      operationId: registerNativePushDevice
      tags: [native-push]
      summary: Register (or transfer ownership of) a native push device token
      description: >-
        Upserts on the globally-unique device token: if the same physical
        device token was previously registered under a different account,
        ownership transfers to the current authenticated user (the correct
        behavior when a device logs out and a different user logs in).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePushRegisterBody"
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid token or platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /native-push/test:
    post:
      operationId: sendNativePushTest
      tags: [native-push]
      summary: Send a sample FCM push to the caller's own registered mobile devices
      description: |
        Native-channel equivalent of POST /push/test. Sends one sample
        notification through the exact `sendNativePushToUser` code path
        production uses, so a passing result is real proof the FCM HTTP v1
        wiring works. Authenticated + per-user rate limited. Does not accept
        a device token or a URL from the request body. Unlike /push/test,
        the outcome reflects FCM's per-message acceptance — see
        NativePushTestResult.
      responses:
        "200":
          description: At least one test push was accepted by FCM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePushTestResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Caller has no registered mobile devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: FCM rejected every targeted device token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativePushTestResult"
        "503":
          description: Native push provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /native-push/unregister:
    delete:
      operationId: unregisterNativePushDevice
      tags: [native-push]
      summary: Remove the caller's own native push device registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativePushUnregisterBody"
      responses:
        "200":
          description: Device removed (idempotent — also 200 if it wasn't registered, or belonged to someone else)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

