        guardrailOvertrading:
          type: boolean
          description: Show soft warning when the user crosses the per-hour or per-day analysis count.
        guardrailHighRisk:
          type: boolean
          description: Show soft warning when a high-impact event for the instrument prints within 30 min.
        coolingOffEnabled:
          type: boolean
          description: Opt-in 30-minute countdown after a significant loss before showing the analyse button warning.
        pushAnalysisCompleted:
          type: boolean
          description: OS push when an AI analysis finishes processing.
        pushTpSlHit:
          type: boolean
          description: OS push when a tracked trade plan's TP or SL level is crossed.
        pushLoginAlert:
          type: boolean
          description: OS push on a new login. The in-app notification is always created regardless of this toggle.
        nativePushEnabled:
          type: boolean
          description: Master switch for native (FCM) push delivery to registered mobile devices.
        webPushEnabled:
          type: boolean
          description: Master switch for Web Push (VAPID) delivery to subscribed browsers.
        quietHoursEnabled:
          type: boolean
          description: When false, quiet hours are disabled entirely for this user.
