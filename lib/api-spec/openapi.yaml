components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token returned by login or registration.
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_token
      description: Browser session cookie.
  schemas:

    ProgressionSummary:
      type: object
      required: [totalXp, level, masteryLevel, rank, currentLevelXp, nextLevelXp, currentStreak, longestStreak]
      properties:
        totalXp: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1, maximum: 100 }
        masteryLevel: { type: integer, minimum: 0 }
        rank: { type: string }
        currentLevelXp: { type: integer, minimum: 0, description: Absolute XP floor for current level }
        nextLevelXp: { type: integer, minimum: 1, description: Absolute XP target for next level or Mastery step }
        currentStreak: { type: integer, minimum: 0 }
        longestStreak: { type: integer, minimum: 0 }
    ProgressionAchievement:
      type: object
      required: [key, unlocked, unlockedAt]
      properties:
        key: { type: string }
        unlocked: { type: boolean }
        unlockedAt: { type: ["string", "null"], format: date-time }
    ProgressionCatalog:
      type: object
      required: [achievements, completedGuideIds]
      properties:
        achievements: { type: array, items: { $ref: "#/components/schemas/ProgressionAchievement" } }
        completedGuideIds:
          type: array
          items: { type: string }
          description: Guide article IDs with a valid, non-revoked completion award.
    ProgressionLedgerEntry:
      type: object
      required: [id, source, xp, dayBucket, ruleVersion, createdAt]
      properties:
        id: { type: integer }
        source: { type: string }
        xp: { type: integer }
        dayBucket: { type: string }
        ruleVersion: { type: string }
        createdAt: { type: string, format: date-time }
    ProgressionHistory:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ProgressionLedgerEntry" } }
    ProgressionActivityInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 32 }
    ProgressionEvidenceStartInput:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [pre_analysis_checklist, guide_completion] }
        guideId: { type: string, enum: [how-ai-works, feature-map, reading-analysis, validity-confidence, adaptive-plan, personal-progression, analysis-workflow, bias-confidence-validity, levels-chart, timeframe-risk-map, technical-fundamental, standard-plan, adaptive-position-plan, account-rules, terms] }
        checklist:
          type: object
          required: [instrument, timeframe]
          properties:
            instrument: { type: string }
            timeframe: { type: string }
    ProgressionEvidenceSession:
      type: object
      required: [token, source, subject, minimumCompleteAt]
      properties:
        token: { type: string }
        source: { type: string }
        subject: { type: string }
        minimumCompleteAt: { type: string, format: date-time }
    ProgressionAward:
      type: object
      required: [awarded, xp]
      properties:
        awarded: { type: boolean }
        xp: { type: integer }
        reason: { type: string }
    ProgressionAuditEntry:
      type: object
      required: [id, userId, source, sourceEventId, xp, dayBucket, ruleVersion, metadata, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        source: { type: string }
        sourceEventId: { type: string }
        xp: { type: integer }
        dayBucket: { type: string }
        ruleVersion: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ProgressionAudit:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ProgressionAuditEntry" } }
    ProgressionBackfillResult:
      type: object
      required: [awarded, scanned, ruleVersion]
      properties:
        awarded: { type: integer, minimum: 0 }
        scanned: { type: integer, minimum: 0 }
        ruleVersion: { type: string }

    StandardTradingRules:
      type: object
      description: "The single broker-neutral ruleset used for TP Standard Trading Rules estimates."
      properties:
        name:
          type: string
        version:
          type: string
        effectiveDate:
          type: string
          format: date
        sourceDocument:
          type: string
        fixedRate:
          type: object
          properties:
            usd:
              type: number
            idr:
              type: number
            label:
              type: string
          required: [usd, idr, label]
        account:
          $ref: "#/components/schemas/StandardTradingRuleAccount"
        transactionFormula:
          type: string
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/StandardTradingRuleInstrument"
        disclaimer:
          $ref: "#/components/schemas/StandardTradingRuleText"
        relationshipDisclosure:
          $ref: "#/components/schemas/StandardTradingRuleText"
      required: [name, version, effectiveDate, sourceDocument, fixedRate, account, transactionFormula, instruments, disclaimer, relationshipDisclosure]

    StandardTradingRuleText:
      type: object
      properties:
        id:
          type: string
        en:
          type: string
      required: [id, en]

    StandardTradingRuleAccount:
      type: object
      properties:
        minimumDepositUsd:
          type: number
        minimumLot:
          type: number
        maximumLot:
          type: number
        maintenanceMarginPercent:
          type: number
        marginCallBelowPercent:
          type: number
        marginCallRestorePercent:
          type: number
        autoLiquidationAtOrBelowPercent:
          type: number
        equityReviewThresholdUsd:
          type: number
        equityReviewThresholdIdr:
          type: number
      required: [minimumDepositUsd, minimumLot, maximumLot, maintenanceMarginPercent, marginCallBelowPercent, marginCallRestorePercent, autoLiquidationAtOrBelowPercent, equityReviewThresholdUsd, equityReviewThresholdIdr]

    StandardTradingRuleInstrument:
      type: object
      properties:
        code:
          type: string
          enum: [XUL10, BCO10_BBJ, HKK50_BBJ, JPK50_BBJ]
        product:
          type: string
        contractSize:
          type: number
        contractUnit:
          type: string
          enum: [troy ounce, barrel, USD/point]
        tradingDays:
          type: string
        tradingHours:
          type: object
          properties:
            summer:
              type: string
            winter:
              type: string
          required: [summer, winter]
        initialMarginUsdPerLot:
          type: number
        facilityFeeUsdPerLotPerSide:
          type: ["number", "null"]
        vatPercent:
          type: number
        rolloverUsdPerLotPerNight:
          type: number
        priceSource:
          type: string
        priceGuidance:
          type: string
        minimumSpread:
          type: string
        maximumSpread:
          type: string
        hecticSpread:
          type: string
        minimumPriceMovement:
          type: string
        limitStopRange:
          type: string
        deliveryBy:
          type: string
