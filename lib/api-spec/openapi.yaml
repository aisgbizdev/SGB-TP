            inflate it), counted per event, not per distinct user —
            independent of totalAnalysesToday.
        totalLogoutsToday:
          type: integer
          description: >-
            Logout events today (user-initiated or the 15-minute web idle
            auto-logout) for role='user' accounts only, counted per event.
